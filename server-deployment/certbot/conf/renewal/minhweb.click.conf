version = 4.2.0
archive_dir = /etc/letsencrypt/archive/minhweb.click
cert = /etc/letsencrypt/live/minhweb.click/cert.pem
privkey = /etc/letsencrypt/live/minhweb.click/privkey.pem
chain = /etc/letsencrypt/live/minhweb.click/chain.pem
fullchain = /etc/letsencrypt/live/minhweb.click/fullchain.pem

# Options used in the renewal process
[renewalparams]
account = 1f86916b890286e9df851a6d3344c4eb
authenticator = webroot
webroot_path = /var/www/certbot,
server = https://acme-v02.api.letsencrypt.org/directory
key_type = ecdsa
[[webroot_map]]
minhweb.click = /var/www/certbot
www.minhweb.click = /var/www/certbot
