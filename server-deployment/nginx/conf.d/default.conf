server {
	listen 80;

	server_name minhweb.click www.minhweb.click;

	location /.well-known/acme-challenge/ {
		root /var/www/certbot;
	}
	location / {
		return 301 https://$host$request_uri;
	}
}

server {
	listen 443 ssl http2;
	server_name minhweb.click www.minhweb.click;

	root /var/www/html/public;
	index index.php;

	ssl_certificate /etc/letsencrypt/live/minhweb.click/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/minhweb.click/privkey.pem;

	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

	location /_next {

		proxy_pass http://frontend:3000;

		add_header Cache-Control "public, max-age=31536000, immutable";

	}	


	# --- LOCATION CHO CÁC FILE ẢNH CỦA LARAVEL ---

	# Phục vụ trực tiếp từ thư mục public của Laravel

	location /storage {
		# 'try_files' sẽ tìm file vật lý. Nếu không có, nó báo lỗi 404.
		try_files $uri $uri/ =404;


	}


# Bất kỳ URL nào khớp sẽ được xử lý ở đây


	location ~ ^/(api|sanctum|login|logout|register) {

	# KHÔNG DÙNG try_files ở đây.

	# Chuyển thẳng request cho PHP-FPM
		fastcgi_pass backend:9000;

		fastcgi_index index.php;
		include fastcgi_params;

	# Chỉ định file script chính để thực thi, Laravel sẽ lo phần còn lại

		fastcgi_param SCRIPT_FILENAME $document_root/index.php;
	}


	# --- LOCATION CHO FRONTEND ---
	# Bắt tất cả các request không khớp với location ở trên

	location / {
		proxy_pass http://frontend:3000;

		proxy_set_header Host $host;


		proxy_set_header X-Real-IP $remote_addr;
	}
}
