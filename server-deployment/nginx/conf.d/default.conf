# server-deployment/nginx/conf.d/default.conf
server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;

    # Cấu hình cho Let's Encrypt renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Chuyển hướng tất cả request HTTP sang HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name yourdomain.com www.yourdomain.com;

    # Đường dẫn đến chứng chỉ SSL (Certbot sẽ tạo)
    ssl_certificate /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Location cho Frontend
    location / {
        proxy_pass http://frontend:3000; # 'frontend' là tên service trong docker-compose
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Location cho Backend API
    location /api {
        # Xóa /api khỏi URL trước khi chuyển tiếp
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://backend:9000; # 'backend' là tên service trong docker-compose
        # Cấu hình để Nginx xử lý các file .php
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php; # Luôn trỏ đến index.php
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }
}