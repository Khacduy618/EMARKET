server {
	listen 80;

	server_name minhweb.click www.minhweb.click;

	location /.well-known/acme-challenge/ {
		root /var/www/certbot;
	}
	location / {
		# proxy_pass http://frontend:3000;
		 return 301 https://$host$request_uri;
	}
}

server {
 	listen 443 ssl http2;
	server_name minhweb.click www.minhweb.click;
	
	client_max_body_size 300M;

	root /var/www/html/public;
	index index.php;

	ssl_certificate /etc/letsencrypt/live/minhweb.click/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/minhweb.click/privkey.pem;

	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

	location /_next {

		proxy_pass http://frontend:3000;

		add_header Cache-Control "public, max-age=31536000, immutable";

	}	

	location /storage {
		
		try_files $uri $uri/ =404;

	}

	location ~ ^/(api|sanctum|login|logout|register) {

		fastcgi_pass backend:9000;

		fastcgi_index index.php;
		include fastcgi_params;

		fastcgi_param SCRIPT_FILENAME $document_root/index.php;
	}

	location / {
		proxy_pass http://frontend:3000;

		proxy_set_header Host $host;


		proxy_set_header X-Real-IP $remote_addr;
	}
}
