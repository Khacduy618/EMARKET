version: '3.8'

services:
  backend:
    image: khduy555/backend:latest
    container_name: backend-app
    restart: unless-stopped
    working_dir: /var/www/html
    user: "1000:1000"
    volumes:
      - ../Backend:/var/www/html
      - backend_storage:/var/www/html/storage
    env_file:
      - ./backend.env
    networks:
      - app-network
    command: sh -c "php artisan storage:link && php-fpm"

  frontend:
    image: khduy555/frontend:latest
    container_name: frontend-app
    restart: unless-stopped
    env_file:
      - ./frontend.env
    networks:
      - app-network
    depends_on:
      - backend

  nginx:
    image: nginx:1.25-alpine
    container_name: nginx-proxy
    restart: always
    ports:
      - "80:80" # <-- Chỉ cần cổng 80
    volumes:
      - ../Backend:/var/www/html:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    networks:
      - app-network
    depends_on:
      - frontend
      - backend

networks:
  app-network:
    driver: bridge

volumes:
  backend_storage:
