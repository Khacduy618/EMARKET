version: '3.8'

services:
  backend:
    image: khduy555/backend:latest
    container_name: backend-app
    restart: unless-stopped
    working_dir: /var/www/html
    user: "1000:1000"
    volumes:
      - backend_public:/var/www/html/public
      - backend_storage:/var/www/html/storage
    env_file:
      - ./backend.env
    networks:
      - app-network
    command: sh -c "php artisan storage:link && php-fpm"

  frontend:
    image: khduy555/frontend:latest
    container_name: frontend-app
    restart: unless-stopped
    env_file:
      - ./frontend.env
    networks:
      - app-network
    depends_on:
      - backend

  nginx:
    image: nginx:1.25-alpine
    container_name: nginx-proxy
    restart: always
    ports:
      - "80:80" # <-- Chỉ cần cổng 80
      - "443:443"
    volumes:
      - backend_public:/var/www/html/public
      - backend_storage:/var/www/html/storage
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    networks:
      - app-network
    depends_on:
      - frontend
      - backend
  worker:
    image: khduy555/backend:latest
    container_name: ecommerce_worker # Thêm container_name cho dễ quản lý
    volumes:
      - backend_public:/var/www/html/public
      - backend_storage:/var/www/html/storage
    env_file:
      - ./backend.env

    command: php artisan queue:work --sleep=3 --tries=3 --timeout=0
    restart: unless-stopped
    networks:
      - app-network

  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - ./certbot/www:/var/www/certbot:rw
      - ./certbot/conf:/etc/letsencrypt:rw
  cron:
    image: khduy555/backend:latest
    container_name: laravel_cron
    restart: unless-stopped
    volumes:
      - ./crontab:/etc/cron.d/laravel-cron
      - backend_storage:/var/www/html/storage
    env_file:
      - ./backend.env
    command: sh -c "chmod 0644 /etc/cron.d/laravel-cron && crond -f -L /dev/stdout"
    networks:
      - app-network
    depends_on:
      - backend

networks:
  app-network:
    driver: bridge
volumes:
    backend_storage:
    backend_public: