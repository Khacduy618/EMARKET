

 server {
	     listen 80;
	         server_name localhost;
		     
			client_max_body_size 300M;	
					 
		     # Thư mục gốc chung
		     root /var/www/html/public;
		         index index.php;
			

	        location /_next {
		        proxy_pass http://frontend:3000;
			        add_header Cache-Control "public, max-age=31536000, immutable";
				    }

				        # --- LOCATION CHO CÁC FILE ẢNH CỦA LARAVEL ---
				        # Phục vụ trực tiếp từ thư mục public của Laravel
            # location /storage {
            #         # 'try_files' sẽ tìm file vật lý. Nếu không có, nó báo lỗi 404.
            #         try_files $uri $uri/ =404;
            #         }
 location /storage/ {
        # 'alias' trỏ thẳng đến thư mục chứa file gốc
        alias /etc/storage/;
        try_files $uri $uri/ =404;

        # Header cho phép trình duyệt cache file, tăng tốc độ tải
        expires 1y;
        add_header Cache-Control "public";
    }



			     # --- LOCATION CHO BACKEND (API, SANCTUM, LOGIN, STORAGE...) ---
			     # Bất kỳ URL nào khớp sẽ được xử lý ở đây
			     location ~ ^/(api|sanctum|login|logout|register) {
				             # KHÔNG DÙNG try_files ở đây.
				             # Chuyển thẳng request cho PHP-FPM
				             fastcgi_pass backend:9000;
					             
					             fastcgi_index index.php;
						             include fastcgi_params;
							             
							             # Chỉ định file script chính để thực thi, Laravel sẽ lo phần còn lại
							             fastcgi_param SCRIPT_FILENAME $document_root/index.php;
								         }

									     # --- LOCATION CHO FRONTEND ---
									     # Bắt tất cả các request không khớp với location ở trên
									     location / {
										             proxy_pass http://frontend:3000;
											             proxy_set_header Host $host;
												             proxy_set_header X-Real-IP $remote_addr;
													             proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
														             proxy_set_header X-Forwarded-Proto $scheme;
															         }
															 }










