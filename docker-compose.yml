
version: '3.8'

services:
  # Frontend Service (Next.js)
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: ecommerce_frontend
    working_dir: /app
    ports:
      - "3000:3000" # Vẫn giữ để có thể truy cập trực tiếp nếu cần debug
    volumes:
      - ./Frontend:/app
      - /app/node_modules # Giữ node_modules trong container, không bị ghi đè bởi host
      - /app/.next        # Giữ cache build của Next.js
    environment:
      NODE_ENV: development # Cho pnpm run dev
      # NEXT_PUBLIC_API_URL trỏ tới Nginx trên host, với /api prefix
      # Trình duyệt sẽ gọi http://localhost/api/...
      NEXT_PUBLIC_API_URL: http://localhost/api
      INTERNAL_API_URL: http://nginx/api
    networks:
      - ecommerce_network
    depends_on:
      - backend # Frontend có thể cần backend sẵn sàng
      - nginx

  # Backend Service (Laravel App - PHP-FPM)
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: ecommerce_backend
    working_dir: /var/www/html
    ports:
      - "8001:8000" 
    volumes:
      - ./Backend:/var/www/html # Mount source code cho development
      # Để vendor trong image, không bị host mount ghi đè (tùy chọn, nhưng tốt hơn)
      # Nếu không dùng dòng dưới, đảm bảo chạy `composer install` trong container sau khi up nếu cần
      - /var/www/html/vendor
    env_file:
      - ./Backend/.env # Đảm bảo file .env tồn tại trong thư mục Backend
    environment:
      # Các biến này sẽ ghi đè giá trị trong .env nếu được đặt ở đây
      # Quan trọng: DB_HOST phải là tên service của database
      DB_HOST: db
      DB_PORT: 3306
      # Các biến khác như APP_KEY, APP_URL nên để trong Backend/.env
    depends_on:
      - db
    networks:
      - ecommerce_network

  # Nginx Service (Reverse Proxy)
  nginx:
    image: nginx:alpine
    container_name: ecommerce_nginx
    ports:
      - "80:80" # Nginx sẽ là cổng chính vào hệ thống
    volumes:
      # Mount source code của Laravel để Nginx có thể tìm thấy public/index.php
      - ./Backend:/var/www/html:ro # ro (read-only) là tốt nếu Nginx chỉ đọc
      # Mount file cấu hình Nginx
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      # - frontend
    networks:
      - ecommerce_network

  # Database Service (MySQL)
  db:
    image: mysql:8.0
    container_name: ecommerce_db
    ports:
      - "33061:3306" # Port 33061 trên host map vào port 3306 của container
    environment:
      MYSQL_DATABASE: ecommerce       # Phải khớp với DB_DATABASE của backend
      MYSQL_ROOT_PASSWORD: ""        # Mật khẩu root rỗng
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes" # Cho phép mật khẩu root rỗng
      TZ: Asia/Ho_Chi_Minh 
    volumes:
      - ./ecommerce_db_data:/var/lib/mysql # Sử dụng named volume để persist data
    networks:
      - ecommerce_network

  # phpMyAdmin Service (Tùy chọn)
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: ecommerce_phpmyadmin
    ports:
      - "8081:80" # Truy cập phpMyAdmin qua http://localhost:8081
    environment:
      PMA_HOST: db         # Kết nối đến service 'db' (MySQL)
      PMA_PORT: 3306
      PMA_USER: root       # User để login vào MySQL
      PMA_PASSWORD: ""     # Password (rỗng trong trường hợp này)
      UPLOAD_LIMIT: 300M   # Giới hạn upload file nếu cần
    depends_on:
      - db
    networks:
      - ecommerce_network

networks:
  ecommerce_network:
    driver: bridge

volumes: # Khai báo named volume cho data MySQL
  ecommerce_db_data: