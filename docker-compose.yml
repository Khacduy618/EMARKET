version: '3.8'
services:
  # Database Service (MySQL)
  db:
    image: docker.io/library/mysql:8.0
    container_name: ecommerce_db
    ports:
      - "33061:3306"
    environment:
      MYSQL_DATABASE: ecommerce
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: laravel
      MYSQL_PASSWORD: laravel
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - ecommerce_db_data:/var/lib/mysql
      - ./my.cnf:/etc/mysql/conf.d/my.cnf
    networks:
      - ecommerce_network
    restart: unless-stopped

  

  # Backend Service (Laravel)
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: ecommerce_backend
    working_dir: /var/www/html
    ports:
      - "8001:8000"
    volumes:
      - ./Backend:/var/www/html
      - /var/www/html/vendor
      - ./Backend/php.ini:/usr/local/etc/php/conf.d/custom-php.ini:ro
    env_file:
      - ./Backend/.env
    environment:
      DB_HOST: db
      DB_PORT: 3306
      TZ: Asia/Ho_Chi_Minh
    depends_on:
      - db
    networks:
      - ecommerce_network
    restart: unless-stopped

  # Frontend Service (Next.js)
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: ecommerce_frontend
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - ./Frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      NODE_ENV: development
      TZ: Asia/Ho_Chi_Minh
    networks:
      - ecommerce_network
    depends_on:
      - backend
    restart: unless-stopped

  # Nginx Service
  nginx:
    image: docker.io/library/nginx:alpine
    container_name: ecommerce_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./Backend/public/storage/:/etc/storage/
    environment:
      TZ: Asia/Ho_Chi_Minh
    depends_on:
      - backend
      - frontend
    networks:
      - ecommerce_network
    restart: unless-stopped
  
  # phpMyAdmin Service
  phpmyadmin:
    image: docker.io/phpmyadmin/phpmyadmin:latest
    container_name: ecommerce_phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root
      UPLOAD_LIMIT: 300M
    depends_on:
      - db
    networks:
      - ecommerce_network
    restart: unless-stopped
  worker:
    build:
      context: ./Backend # 1. Build từ cùng context với service 'backend'
      dockerfile: Dockerfile
    container_name: ecommerce_worker # Thêm container_name cho dễ quản lý
    volumes:
      - ./Backend:/var/www/html # 2. Map thư mục code giống hệt service 'backend'
    env_file:
      - ./Backend/.env # Cần file .env để kết nối DB
    environment:
      DB_HOST: db # Cần biến môi trường để kết nối DB
      DB_PORT: 3306
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=0
    restart: unless-stopped
    depends_on:
      - db
    networks:
      - ecommerce_network # 3. Tham gia vào cùng network



networks:
  ecommerce_network:
    driver: bridge

volumes:
  ecommerce_db_data:
  ecommerce_mongo_data: