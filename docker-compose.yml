version: '3.8'
services:
  # Database Service (MySQL)
  db:
    image: docker.io/library/mysql:8.0
    container_name: ecommerce_db
    ports:
      - "33061:3306"
    environment:
      MYSQL_DATABASE: ecommerce
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: laravel
      MYSQL_PASSWORD: laravel
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - ecommerce_db_data:/var/lib/mysql
    networks:
      - ecommerce_network
    restart: unless-stopped

  # MongoDB Service
  db_mongo:
    image: docker.io/library/mongo:latest
    container_name: ecommerce_db_mongo
    ports:
      - "27017:27017"
    volumes:
      - ecommerce_mongo_data:/data/db
      - ./data_mongo_import:/data/import
    environment:
      TZ: Asia/Ho_Chi_Minh
    networks:
      - ecommerce_network
    restart: unless-stopped

  # Backend Service (Laravel)
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: ecommerce_backend
    working_dir: /var/www/html
    ports:
      - "8001:8000"
    volumes:
      - ./Backend:/var/www/html
      - /var/www/html/vendor
    env_file:
      - ./Backend/.env
    environment:
      DB_HOST: db
      DB_PORT: 3306
      TZ: Asia/Ho_Chi_Minh
    depends_on:
      - db
    networks:
      - ecommerce_network
    restart: unless-stopped

  # Socket.IO Chat Server
  socket_chat_server:
    build:
      context: ./SocketServerChat
      dockerfile: Dockerfile
    container_name: ecommerce_socket_chat_server
    working_dir: /usr/src/app
    ports:
      - "3002:3002"
    volumes:
      - ./SocketServerChat:/usr/src/app
      - /usr/src/app/node_modules
    env_file:
      - ./SocketServerChat/.env
    environment:
      NODE_ENV: development
      TZ: Asia/Ho_Chi_Minh
    networks:
      - ecommerce_network
    depends_on:
      - db_mongo
      - backend
    restart: unless-stopped

  # Frontend Service (Next.js)
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: ecommerce_frontend
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - ./Frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://nginx:8090/api
      NEXT_PUBLIC_WEB_URL: http://nginx:8090
      NEXT_PUBLIC_SOCKET_SERVER_URL: http://nginx:8090/socket.io
      INTERNAL_API_URL: http://backend:8000/api
      TZ: Asia/Ho_Chi_Minh
    networks:
      - ecommerce_network
    depends_on:
      - backend
    restart: unless-stopped

  # Nginx Service
  nginx:
    image: docker.io/library/nginx:alpine
    container_name: ecommerce_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./Backend/public/storage/:/etc/storage/
    environment:
      TZ: Asia/Ho_Chi_Minh
    depends_on:
      - backend
      - frontend
      - socket_chat_server
    networks:
      - ecommerce_network
    restart: unless-stopped

  # phpMyAdmin Service
  phpmyadmin:
    image: docker.io/phpmyadmin/phpmyadmin:latest
    container_name: ecommerce_phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root
      UPLOAD_LIMIT: 300M
    depends_on:
      - db
    networks:
      - ecommerce_network
    restart: unless-stopped

  # Mongo Express Service
  mongo_express:
    image: docker.io/library/mongo-express:latest
    container_name: ecommerce_mongo_express
    ports:
      - "8082:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: db_mongo
      ME_CONFIG_MONGODB_PORT: 27017
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: 123456
      ME_CONFIG_SITE_BASEURL: /
      TZ: Asia/Ho_Chi_Minh
    depends_on:
      - db_mongo
    networks:
      - ecommerce_network
    restart: unless-stopped

networks:
  ecommerce_network:
    driver: bridge

volumes:
  ecommerce_db_data:
  ecommerce_mongo_data:
