services:
  
  # Backend Service (Laravel)
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: ecommerce_backend
    working_dir: /var/www/html
    ports:
      - "8001:8000"
    volumes:
      - ./Backend:/var/www/html
      - /var/www/html/vendor
      - ./Backend/php.ini:/usr/local/etc/php/conf.d/custom-php.ini:ro
    env_file:
      - ./Backend/.env
    environment:
      TZ: Asia/Ho_Chi_Minh
      # DB_HOST, DB_PORT, DB_USERNAME, DB_PASSWORD bạn đặt trong .env kết nối DB online
    networks:
      - ecommerce_network
    restart: unless-stopped

  # Frontend Service (Next.js)
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: ecommerce_frontend
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - ./Frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      NODE_ENV: development
      TZ: Asia/Ho_Chi_Minh
    depends_on:
      - backend
    networks:
      - ecommerce_network
    restart: unless-stopped

  # Nginx Service (Reverse Proxy)
  nginx:
    image: nginx:alpine
    container_name: ecommerce_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./Backend/storage/app/public:/usr/share/nginx/html/storage

    environment:
      TZ: Asia/Ho_Chi_Minh
    depends_on:
      - backend
      - frontend
    networks:
      - ecommerce_network
    restart: unless-stopped

networks:
  ecommerce_network:
    driver: bridge
