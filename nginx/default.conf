server {
    # 1. Lắng nghe trên port nào bên trong container Nginx
    listen 80; # Port 80 là port HTTP tiêu chuẩn

    # 2. Tên miền (không quá quan trọng khi chạy local, nhưng cần thiết cho production)
    server_name localhost:8001; # Hoặc _ để khớp với mọi tên miền

    # 3. Thư mục gốc chứa các file của ứng dụng (thư mục public của Laravel)
    # Nginx sẽ tìm file trong /var/www/html/public bên trong container Nginx
    # Thư mục /var/www/html bên trong container Nginx được mount từ ./Backend trên host
    root /var/www/html/public;

    # 4. Các file index mặc định
    index index.php index.html index.htm;

    # 5. Xử lý các request thông thường
    location / {
        # Cố gắng tìm file hoặc thư mục khớp với URI.
        # Nếu không tìm thấy, chuyển yêu cầu đến /index.php (Laravel's front controller)
        # với query string ban đầu. Điều này cho phép Laravel xử lý routing.
        try_files $uri $uri/ /index.php?$query_string;
    }

    # 6. Xử lý các request cho file .php
    location ~ \.php$ {
        try_files $uri =404; # Nếu file .php không tồn tại, trả lỗi 404

        # Tách URI thành script name và path info (cần cho một số framework)
        fastcgi_split_path_info ^(.+\.php)(/.+)$;

        # Chuyển tiếp yêu cầu đến PHP-FPM
        # 'backend' là tên service PHP-FPM trong docker-compose.yml
        # 9000 là port mà PHP-FPM đang lắng nghe bên trong container 'backend'
        fastcgi_pass backend:9000;

        # File index mặc định cho FastCGI
        fastcgi_index index.php;

        # Bao gồm các tham số FastCGI tiêu chuẩn
        include fastcgi_params;

        # Đặt biến SCRIPT_FILENAME để PHP-FPM biết file nào cần thực thi
        # $document_root là giá trị của 'root' ở trên (/var/www/html/public)
        # $fastcgi_script_name là phần .php của URI
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

        # Đặt biến PATH_INFO (nếu có)
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    # 7. Chặn truy cập trực tiếp vào các file .htaccess (quan trọng về bảo mật)
    location ~ /\.ht {
        deny all;
    }

    # (Tùy chọn) Ghi log truy cập và lỗi
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
}