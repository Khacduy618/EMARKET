# Định nghĩa các upstream server
upstream laravel_backend_dev_server {
    # Tên service của backend trong docker-compose.yml và port nó expose bên trong network
    server backend:8000; 
}

upstream nextjs_frontend_dev_server {
    # Tên service của frontend và port nó expose bên trong network
    server frontend:3000;
}

server {
    listen 80;
    server_name localhost;
    charset utf-8;

    # Cấu hình log
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Location đặc biệt cho việc lấy CSRF cookie
    # Bất cứ request nào đến /sanctum/csrf-cookie sẽ được chuyển thẳng đến backend
    location = /sanctum/csrf-cookie {
        proxy_pass http://laravel_backend_dev_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Location cho tất cả các request API
    # Bất cứ request nào bắt đầu bằng /api/ sẽ được chuyển đến backend
    location /api/ {
        proxy_pass http://laravel_backend_dev_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Location để phục vụ file tĩnh của Laravel (ảnh upload)
    location /storage/ {
        # 'alias' trỏ thẳng đến thư mục chứa file gốc
        alias /var/www/html/storage/app/public/;
        try_files $uri $uri/ =404;

        # Header cho phép trình duyệt cache file, tăng tốc độ tải
        expires 1y;
        add_header Cache-Control "public";
    }

    # Location cho TẤT CẢ các request còn lại
    # Sẽ được chuyển đến frontend Next.js để xử lý
    location / {
        proxy_pass http://nextjs_frontend_dev_server;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade"; # Cho phép Hot Reload của Next.js
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}