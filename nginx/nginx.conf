

# ./nginx/nginx.conf (Nội dung sẽ được include vào block http của Nginx chính)

# Định nghĩa upstream cho Laravel development server
upstream laravel_backend_dev_server {
    server backend:8000; # backend là tên service Laravel, 8000 là port artisan serve
}

# Định nghĩa upstream cho Next.js dev server
upstream nextjs_frontend_dev_server {
    server frontend:3000;
}

# (Tùy chọn) Định nghĩa upstream cho Socket.IO server nếu muốn proxy WebSocket qua Nginx
# upstream socket_io_chat_server {
#     server socket_chat_server:3002; # socket_chat_server là tên service Socket.IO
# }

server {
    listen 80;
    server_name localhost; # Hoặc domain của bạn

    # Thư mục root cho các file tĩnh của Laravel (nếu có và Nginx cần phục vụ trực tiếp)
    # Với artisan serve, Nginx chủ yếu làm reverse proxy
    root /var/www/html/public;
    index index.php index.html index.htm;

    location /storage/ {
        # 'alias' trỏ thẳng đến thư mục chứa file gốc, đây là cách tốt nhất
        # Nó bảo Nginx lấy file từ đây, không cần quan tâm đến symbolic link
        alias /var/www/html/storage/app/public/;
        
        # Cố gắng phục vụ file, nếu không tìm thấy thì trả về lỗi 404
        try_files $uri $uri/ =404;

        # Header này cho phép trình duyệt cache ảnh, tăng tốc độ tải trang
        expires 1y;
        add_header Cache-Control "public";
    }
    
    location ~ ^/(images|uploads|css|js)/ {
        root /var/www/html/public;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public";
    }

    # Các yêu cầu đến API (/api/...) được chuyển đến backend Laravel
    location /api {
        proxy_pass http://laravel_backend_dev_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    # (Tùy chọn) Location cho Socket.IO nếu proxy qua Nginx
    # location /socket.io/ {
    #     proxy_pass http://socket_io_chat_server;
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection "upgrade";
    #     proxy_set_header Host $host;
    # }

    # Các yêu cầu còn lại sẽ được chuyển đến frontend (Next.js)
    location / {
        proxy_pass http://nextjs_frontend_dev_server;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade"; # Cho HMR của Next.js
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Xử lý lỗi (tùy chọn)
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}