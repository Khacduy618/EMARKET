events {
    worker_connections 1024;
}

http {
    # Định nghĩa upstream cho PHP-FPM service
    upstream php_fpm_backend {
        # 'backend' là tên service của container PHP-FPM trong docker-compose.yml
        server backend:9000;
    }

    # Định nghĩa upstream cho Next.js dev server
    upstream nextjs_frontend {
        # 'frontend' là tên service của container Next.js trong docker-compose.yml
        server frontend:3000;
    }

    server {
        listen 80;
        server_name localhost; # Hoặc domain của bạn

        # Thư mục root cho các file tĩnh của Laravel (nếu có)
        # Nginx cần truy cập vào đây để tìm index.php
        # Volume mount trong docker-compose sẽ map ./Backend vào /var/www/html của Nginx container
        root /var/www/html/public;
        index index.php index.html index.htm;

        # Các yêu cầu đến API được chuyển đến backend (Laravel qua PHP-FPM)
        location /api {
            # Nếu không tìm thấy file tĩnh khớp với URI (ví dụ /api/somefile.jpg nếu có)
            # thì sẽ chuyển yêu cầu đến @laravel_api (xử lý qua index.php)
            try_files $uri $uri/ @laravel_api;
        }

        # Xử lý các request PHP cho API
        location @laravel_api {
            # Ghi đè một số fastcgi_params để phù hợp với cấu trúc /api
            # SCRIPT_FILENAME trỏ đến file index.php của Laravel
            fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
            # PATH_INFO chứa đường dẫn request mà Laravel sẽ dùng để routing, ví dụ /api/users
            # $document_uri là URI không có query string, ví dụ /api/users
            # Hoặc bạn có thể để Laravel tự parse từ REQUEST_URI
            # fastcgi_param PATH_INFO $document_uri; # Thử nghiệm nếu cần thiết

            include fastcgi_params;
            fastcgi_pass php_fpm_backend; # Chuyển yêu cầu đến upstream PHP-FPM đã định nghĩa
        }


        # Các yêu cầu còn lại sẽ được chuyển đến frontend (Next.js)
        location / {
            proxy_pass http://nextjs_frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Cần thiết cho Hot Module Replacement (HMR) của Next.js dev server
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Xử lý lỗi (tùy chọn)
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html; # Hoặc một trang lỗi tùy chỉnh
        }
    }
}