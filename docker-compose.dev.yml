services:
  # --- BACKEND LARAVEL (PHP-FPM) ---
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile.dev
    container_name: dev-backend-app
    volumes:
      # Mount toàn bộ code backend vào container để có hot-reloading
      - ./Backend:/var/www/html
      # Dùng volume để composer cache không bị chậm trên Mac/Windows
      - composer_cache:/root/.composer/cache
    env_file:
      - ./Backend/.env # Đọc file .env trực tiếp từ thư mục backend
    networks:
      - app-network

  # --- FRONTEND NEXT.JS (DEV SERVER) ---
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile.dev
    container_name: dev-frontend-app
    volumes:
      # Mount code frontend để có hot-reloading
      - ./Frontend:/app
      # Anonymous volume để tránh node_modules trên host ghi đè lên container
      - /app/node_modules
    ports:
      # Expose port 3000 để truy cập trực tiếp nếu cần debug
      - "3000:3000"
    env_file:
      - ./Frontend/.env.local
    networks:
      - app-network

  # --- NGINX REVERSE PROXY ---
  nginx:
    image: nginx:1.25-alpine
    container_name: dev-nginx-proxy
    ports:
      # Cổng chính để truy cập toàn bộ hệ thống
      - "80:80"
    volumes:
      # Mount code backend để Nginx phục vụ file tĩnh (/storage)
      - ./Backend/public:/var/www/html/public:ro
      # Mount file config Nginx dành riêng cho dev
      - ./docker/nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - app-network
    depends_on:
      - frontend
      - backend

networks:
  app-network:
    driver: bridge

volumes:
  composer_cache:
